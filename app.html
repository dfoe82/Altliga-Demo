}

/* ---------- Kader & Aufstellung ---------- */
function lineupView(){
  const e=S.events.find(x=>x.id===ui.lineup); if(!e){ui.lineup=null;return eventsView();}
  const adm=can('events');
  const sq=e.squad||{ids:[],formation:'4-4-2',slots:{}};
  const free=isFree(sq), ids=sq.ids.filter(pById), pos=free?[]:(FORMS[sq.formation]||FORMS['4-4-2']);
  const slotOf=i=>{const id=(sq.slots||{})[i]; return id&&ids.includes(id)?pById(id):null;};
  const starters=new Set(free?starterIds(sq).filter(pById):pos.map((_,i)=>slotOf(i)).filter(Boolean).map(p=>p.id));
  if(!starters.has(ui.freeSel)) ui.freeSel=null;
  const bench=ids.map(pById).filter(p=>!starters.has(p.id)).sort((a,b)=>a.name.localeCompare(b.name,'de'));
  const head=`<div class="panel" style="${secStyle('events')}">
    <button class="back" data-act="lineupBack">‹ Termine</button>
    <div><h2>${esc(evTitle(e))}</h2><p class="hint">${wd(e.date)}, ${fmtDate(e.date)}${e.time?' · '+e.time+' Uhr':''}${e.place?' · '+esc(e.place):''}</p></div>
  </div>`;
  if(ui.form&&adm) return head+`<div class="panel form" style="${secStyle('events')}"><h2>Kader festlegen</h2>${picker()}${saveBar('saveSquad')}</div>`;
  const lines='<span class="pl half"></span><span class="pl circ"></span><span class="pl boxt"></span><span class="pl boxb"></span>';
  const freeEdit=free&&adm&&!!ui.freeEditing;
  const pitch=free?`<div class="pitch ${freeEdit?'freeedit':''}" id="fPitch" data-grid="${gridOf(sq)}" ${freeEdit?'':'role="img" aria-label="Freie Aufstellung"'}>${lines}
    ${freeEdit?gridCells(gridOf(sq)).map(z=>`<i class="gp" style="left:${z.x}%;top:${z.y}%"></i>`).join(''):''}
    ${[...starters].map(id=>{const p=pById(id), c=sq.free[id]; return `<div class="pos ${freeEdit?'drag':''} ${ui.freeSel===id?'sel':''}" data-pid="${id}" style="left:${c.x}%;top:${c.y}%">
      <span class="dp">${esc(p.nr||initials(p.name))}</span><span class="pn">${esc(p.name)}</span></div>`;}).join('')}
  </div>`:`<div class="pitch" role="img" aria-label="Aufstellung ${esc(sq.formation)}">
    ${lines}
    ${pos.map(([code,x,y],i)=>{const p=slotOf(i); return `<div class="pos" style="left:${x}%;top:${y}%">
      <span class="dp ${p?'':'empty'}">${p?esc(p.nr||initials(p.name)):''}</span>
      <span class="pn">${p?esc(p.name):'–'}</span><span class="pr">${code}</span></div>`;}).join('')}
  </div>`;
  const editor=adm?`<div class="panel" style="${secStyle('events')}">
      <div class="row spread"><h2>Aufstellung bearbeiten</h2><button class="btn ghost sm" data-act="editSquad">Kader ändern (${ids.length})</button></div>
      <label class="f" style="max-width:280px">Spielsystem<select id="lFormation">${Object.keys(FORMS).map(f=>`<option ${f===sq.formation?'selected':''}>${f}</option>`).join('')}<option value="${FREE}" ${free?'selected':''}>Frei – selbst positionieren</option></select></label>
      ${free?`<label class="f" style="max-width:280px">Raster<select id="lGrid">${Object.entries(GRIDS).map(([k,l])=>`<option value="${k}" ${+k===gridOf(sq)?'selected':''}>${l}</option>`).join('')}</select></label>
        <p class="hint">${gridOf(sq)?'Mit Raster rasten die Spieler auf dem nächsten Punkt ein – so stehen Reihen gerade und symmetrisch. Ziehst du jemanden auf einen besetzten Punkt, tauschen beide die Plätze. ':''}Spieler auf dem Feld mit dem Finger an die gewünschte Stelle ziehen. Aus der Ersatzbank antippen, um jemanden aufs Feld zu holen. Zum Herausnehmen antippen und „Auf die Bank“ wählen oder vom Feld ziehen.</p>
        ${starters.size?'<button class="edit" style="justify-self:start" data-act="freeClear">Alle auf die Bank</button>':''}`
      :ids.length?`<div class="slots">${pos.map(([code],i)=>{const cur=slotOf(i); return `<label class="slot"><b>${code}</b><select data-slot="${i}" aria-label="Position ${code}">
        <option value="">– frei –</option>${ids.map(pById).sort((a,b)=>a.name.localeCompare(b.name,'de')).map(p=>`<option value="${p.id}" ${cur&&cur.id===p.id?'selected':''}>${p.nr?p.nr+' · ':''}${esc(p.name)}${starters.has(p.id)&&!(cur&&cur.id===p.id)?' (gesetzt)':''}</option>`).join('')}</select></label>`;}).join('')}</div>
      <p class="hint">Wer schon auf einer Position steht und neu zugeordnet wird, wechselt automatisch dorthin.</p>`:'<p class="hint">Lege zuerst den Kader fest.</p>'}
      ${ui.confirmDel==='squad'?confirmBox('squad:'+e.id,'Kader und Aufstellung','Entfernen?','Entfernen'):(ids.length?'<button class="edit" style="justify-self:start" data-act="askDel" data-v="squad">Kader und Aufstellung entfernen</button>':'')}
    </div>`:'';
  return head+`<div class="panel" style="${secStyle('events')}">
      <div class="row spread"><h2>Aufstellung · ${free?'Frei':esc(sq.formation)}</h2><span class="hint">${free?`${starters.size} auf dem Feld${starters.size>11?' (mehr als 11)':''}`:`${starters.size} von ${pos.length}`}</span></div>
      ${ids.length?pitch:'<p class="hint">Für dieses Spiel gibt es noch keinen Kader.</p>'}
      ${freeEdit&&ids.length?`<div class="freebar">${ui.freeSel?`<span><b>${esc(pname(ui.freeSel))}</b> ausgewählt</span><button class="btn ghost sm" data-act="freeBench">Auf die Bank</button>`:`<span class="hint">${starters.size?'Spieler ziehen zum Verschieben, antippen zum Auswählen.':'Tippe unten auf Spieler der Ersatzbank, um sie aufs Feld zu holen.'}</span>`}<button class="btn sm" data-act="freeDone">Fertig</button></div>`
        :free&&adm&&ids.length?`<div class="freebar"><span class="hint">So sehen es die Spieler.</span><button class="btn sm" data-act="freeEditOn">Positionen bearbeiten</button></div>`:''}
      ${ids.length?`<h3>Ersatzbank · ${bench.length}</h3>${bench.length?`<div class="bench">${bench.map(p=>freeEdit?`<button data-act="freeAdd" data-id="${p.id}" aria-label="${esc(p.name)} aufs Feld">${nrBox(p)}${esc(p.name)} <b aria-hidden="true">+</b></button>`:`<span>${nrBox(p)}${esc(p.name)}</span>`).join('')}</div>`:'<p class="hint">Keine Ersatzspieler.</p>'}
        <h3>Kader · ${ids.length}</h3><p class="hint" style="color:var(--ink)">${esc(ids.map(pById).sort((a,b)=>a.name.localeCompare(b.name,'de')).map(p=>(p.nr?p.nr+' ':'')+p.name).join(' · '))}</p>`:''}
    </div>${editor}`;
}

async function claimAdmin(){
  const u=FB.auth.currentUser; if(!u||u.isAnonymous) return 'login';
  const a=await FB.getDoc(D('admins',u.uid)).catch(()=>null); if(a&&a.exists()) return 'ok';
  const setup=await FB.getDoc(D('meta','setup')).catch(()=>null);
  if(setup&&!setup.exists()) return 'setup';
  const email=(u.email||'').toLowerCase();
  const inv=await FB.getDoc(D('invites',email)).catch(()=>null);
  if(!inv||!inv.exists()) return 'noinvite';
  if(!u.emailVerified) return 'verify';
  const d=inv.data(); const b=FB.writeBatch(FB.db);
  b.set(D('admins',u.uid),{name:d.name,role:d.role,areas:d.areas||[],email,...(d.p?{p:d.p}:{})});

async function submitModal(){
  const m=ui.modal; if(!m||m.busy) return;
  const v=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
  const fail=t=>{m.err=t;m.busy=false;renderModal();};
  m.err=''; m.info='';
  try{
    if(m.kind==='code'){ ui.modal=null; renderModal(); return enterCode(v('gateCode')); }
    if(m.kind==='prNew'){ return payreqSubmit(); }
    if(m.kind==='chatPoll'){ const q=v('tpQ').slice(0,200), opts=[...new Set(document.getElementById('tpO').value.split('\n').map(x=>x.trim().slice(0,60)).filter(Boolean))];
      if(!q) return fail('Bitte eine Frage eingeben.'); if(opts.length<2||opts.length>6) return fail('Bitte 2 bis 6 Antworten eintragen.');
      ui.modal=null; renderModal(); return chatPollCreate(q,opts); }
    if(m.kind==='prCheck'){ return payreqResolve(m,true); }
    if(m.kind==='push'){ const prefs={}; document.querySelectorAll('input[name="pPref"]').forEach(x=>prefs[x.value]=x.checked); ui.modal=null; renderModal(); return savePushPrefs(prefs); }
    if(m.kind==='demo'){ ui.demoAdmin=v('mDemo'); ui.adminView=true; ui.modal=null; renderModal(); render(); toast(`Admin-Ansicht: ${me().name}`); return; }
    if(m.kind==='login'){
      const st=m.step||'login'; m.email=v('mEmail').toLowerCase()||m.email;
      if(st==='login'){ m.busy=true; renderModal(); await FB.signInWithEmailAndPassword(FB.auth,m.email,document.getElementById('mPw')?document.getElementById('mPw').value:''); return afterClaim(await claimAdmin()); }
      if(st==='register'){
        const pw=document.getElementById('mPw').value, pw2=document.getElementById('mPw2').value;
        if(pw.length<8) return fail('Das Passwort braucht mindestens 8 Zeichen.');
        if(pw!==pw2) return fail('Die Passwörter sind nicht gleich.');
        m.busy=true; renderModal(); await FB.createUserWithEmailAndPassword(FB.auth,m.email,pw); return afterClaim(await claimAdmin());
      }
      if(st==='reset'){ m.busy=true; renderModal(); await FB.sendPasswordResetEmail(FB.auth,m.email); m.busy=false; m.info='Falls ein Konto existiert, ist der Link unterwegs.'; m.step='login'; renderModal(); return; }
      if(st==='verify'){ m.busy=true; renderModal(); await FB.auth.currentUser.reload(); await FB.auth.currentUser.getIdToken(true);
        if(!FB.auth.currentUser.emailVerified) return fail('Noch nicht bestätigt. Bitte den Link in der E-Mail öffnen.'); return afterClaim(await claimAdmin()); }
      if(st==='setup'){ const name=v('mName'); if(!name) return fail('Bitte einen Namen eingeben.'); m.busy=true; renderModal();
        const u=FB.auth.currentUser, b=FB.writeBatch(FB.db);
        b.set(D('meta','setup'),{owner:u.uid}); b.set(D('admins',u.uid),{name,role:'full',areas:[],email:(u.email||'').toLowerCase()});
        await b.commit(); return afterClaim('ok'); }
      if(st==='noinvite'){ m.busy=true; renderModal(); return afterClaim(await claimAdmin()); }
    }
    if(m.kind==='invite'){
      const name=v('mName'), email=v('mEmail').toLowerCase(), r=readRights();
      if(!name) return fail('Bitte einen Namen eingeben.');
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return fail('Bitte eine gültige E-Mail eingeben.');
      if(r.role==='part'&&!r.areas.length) return fail('Bitte mindestens einen Bereich wählen.');
      if(LIVE.admins.length+LIVE.invites.length>=4) return fail('Es gibt bereits 4 Admins oder Einladungen.');
      m.busy=true; renderModal();
      const lp=v('mPlayer'); await FB.setDoc(D('invites',email),{name,role:r.role,areas:r.role==='part'?r.areas:[],...(lp?{p:lp}:{})});
      logAction(`Admin ${name} eingeladen`); ui.modal=null; renderModal(); toast('Einladung angelegt'); return;
    }
    if(m.kind==='rights'){
      const a=adminList().find(x=>x.uid===m.who); const r=readRights();
      if(r.role==='part'&&a.role!=='part'&&fullCount()<=1) return fail('Mindestens ein Admin muss alle Rechte behalten.');
      if(r.role==='part'&&!r.areas.length) return fail('Bitte mindestens einen Bereich wählen.');
      m.busy=true; renderModal();
      await FB.setDoc(D('admins',a.uid),{role:r.role,areas:r.role==='part'?r.areas:[],p:v('mPlayer')},{merge:true});
      logAction(`Rechte von ${a.name} geändert`); ui.modal=null; renderModal(); toast('Rechte gespeichert'); return;
    }
  }catch(e){ console.warn(e); fail(AUTH_ERR[e&&e.code]||(e&&e.code==='permission-denied'?'Keine Berechtigung.':'Das hat nicht geklappt. Bitte erneut versuchen.')); }
}

/* Serie: jede Woche am selben Wochentag bis einschließlich „bis“, höchstens 60 Termine */
function seriesDates(from,until){ const out=[]; if(!from) return out; for(let d=from;d<=(until||from)&&out.length<60;d=shiftDate(d,7)) out.push(d); return out.length?out:[from]; }
function saveEvent(){
  const f=ui.ev, t=f.type, title=f.title.trim();
  if(!ui.date) return toast('Bitte ein Datum wählen');
  if(t!=='training'&&!title) return toast(t==='game'?'Bitte den Gegner eintragen':'Bitte eine Bezeichnung eintragen');
  let poll=null;
  if(f.poll){
    if(f.ptype==='rsvp') poll={q:RSVPQ[t],opts:[...RSVP]};
    else{
      const opts=f.popts.split('\n').map(s=>s.trim()).filter(Boolean);
      if(!f.pq.trim()) return toast('Bitte die Frage eintragen');
      if(opts.length<2||opts.length>6) return toast('Bitte 2 bis 6 Antworten eintragen');
      poll={q:f.pq.trim(),opts};
    }
  }
  if(poll) poll.comments=!!f.pcomments;
  const base={type:t,time:f.time,title,home:f.home,place:f.place.trim(),note:f.note.trim(),comments:!!f.comments};
  if(t==='training'){ base.venue=f.venue==='in'?'in':'out'; }
  let n=1;
  if(ui.editKey){
    const e=S.events.find(x=>x.id===ui.editKey); const old=e.poll;
    Object.assign(e,base,{date:ui.date});
    if(t!=='game') delete e.squad;
    if(t==='training'&&f.cancel) e.cancel=true; else delete e.cancel;
    if(t!=='training') delete e.venue;
    if(!poll){ if(old&&Object.keys(old.votes||{}).length) archivePoll({...e,poll:old}); delete e.poll; }
    else if(old&&old.q===poll.q&&JSON.stringify(old.opts)===JSON.stringify(poll.opts)){ e.poll=old; e.poll.comments=poll.comments; }
    else e.poll={...poll,votes:{},open:true};
  }else{
    const dates=t==='training'&&f.repeat?seriesDates(ui.date,f.until||shiftDate(ui.date,364)):[ui.date];
    n=dates.length;
    dates.forEach(d=>S.events.push({id:uid(),...base,date:d,...(poll?{poll:{...poll,opts:[...poll.opts],votes:{},open:true}}:{})}));
  }
  closeForm(); commit(); toast(n>1?`${n} Trainings angelegt`:'Termin gespeichert');
}

    if(!st.moved&&Math.hypot(e.clientX-st.x0,e.clientY-st.y0)<6) return; st.moved=true;
    const r=pitch.getBoundingClientRect();
    const g=snapTo(+pitch.dataset.grid||0,Math.max(4,Math.min(96,(e.clientX-r.left)/r.width*100)),Math.max(4,Math.min(96,(e.clientY-r.top)/r.height*100)));
    st.x=g.x; st.y=g.y; d.style.left=st.x+'%'; d.style.top=st.y+'%';
    st.out=e.clientX<r.left-12||e.clientX>r.right+12||e.clientY<r.top-12||e.clientY>r.bottom+12; d.classList.toggle('out',st.out);
  };
  const up=()=>{
    d.removeEventListener('pointermove',mv); d.removeEventListener('pointerup',up); d.removeEventListener('pointercancel',up); d.classList.remove('dragging');
    const e=S.events.find(x=>x.id===ui.lineup); if(!e||!e.squad) return; const sq=e.squad; sq.free=sq.free||{};

    if(st.out){ delete sq.free[st.id]; ui.freeSel=null; commit(); toast(`${pname(st.id)} auf der Bank`); return; }
    const to={x:st.x,y:st.y}, from=sq.free[st.id];
    if(gridOf(sq)){ const other=Object.keys(sq.free).find(k=>k!==st.id&&samePos(sq.free[k],to)); if(other&&from) sq.free[other]={...from}; }
    sq.free[st.id]=to; ui.freeSel=null; commit();
  };
  d.addEventListener('pointermove',mv); d.addEventListener('pointerup',up); d.addEventListener('pointercancel',up);
});

  case 'editSquad': {const e=S.events.find(x=>x.id===ui.lineup); if(!e||!can('events')) return; closeForm(); ui.form=true; ui.sel=new Set((e.squad&&e.squad.ids||[]).filter(pById)); render(); toTop(); break;}
  case 'saveSquad': {
    const e=S.events.find(x=>x.id===ui.lineup); if(!e||!can('events')) return;
    const sq=e.squad||{ids:[],formation:'4-4-2',slots:{}};
    sq.ids=[...ui.sel]; Object.keys(sq.slots).forEach(k=>{if(!ui.sel.has(sq.slots[k])) delete sq.slots[k];});
    if(sq.free) Object.keys(sq.free).forEach(id=>{if(!ui.sel.has(id)) delete sq.free[id];});
    e.squad=sq; closeForm(); commit(); toast(`Kader mit ${sq.ids.length} Spielern gespeichert`); break;}
  case 'freeEditOn': ui.freeEditing=true; ui.freeSel=null; render(); break;
  case 'freeDone': ui.freeEditing=false; ui.freeSel=null; render(); toast('Aufstellung gespeichert'); break;
  case 'freeAdd': case 'freeBench': case 'freeClear': {
    const e=S.events.find(x=>x.id===ui.lineup); if(!e||!e.squad||!can('events')) return; const sq=e.squad; sq.free=sq.free||{};
    if(a==='freeAdd'){ sq.free[id]=freeSpot(sq); ui.freeSel=id; commit(); toast(`${pname(id)} steht auf dem Feld – jetzt an die richtige Stelle ziehen`); }
    else if(a==='freeBench'){ if(ui.freeSel){ delete sq.free[ui.freeSel]; toast(`${pname(ui.freeSel)} auf der Bank`); ui.freeSel=null; commit(); } }
    else { sq.free={}; ui.freeSel=null; ui.freeEditing=true; commit(); toast('Alle auf der Bank'); }
    break;}
  case 'vote': {const e=S.events.find(x=>x.id===v); if(e&&e.poll&&e.poll.open) doVote(e,+b.dataset.i); break;}
  case 'pollNames': ui.showNames=ui.showNames===v?null:v; render(); break;
  case 'closePoll': {const e=S.events.find(x=>x.id===v); if(e&&e.poll&&can('events')){e.poll.open=false; archivePoll(e); commit(); toast('Umfrage beendet und unter Optionen gespeichert');} break;}
  case 'reopenPoll': {const e=S.events.find(x=>x.id===v); if(e&&e.poll&&can('events')){e.poll.open=true; commit(); toast('Umfrage wieder geöffnet');} break;}
  case 'archNames': ui.openArch=ui.openArch===v?null:v; render(); break;
  case 'askDel': if(!isAdmin()&&!v.startsWith('tp:')) return; ui.confirmDel=v; render(); break;
  case 'noDel': ui.confirmDel=null; render(); break;
  case 'doDel': {
    const i=v.indexOf(':'), t=v.slice(0,i), k=v.slice(i+1);
    if(t==='tp'){ tpDelete(k); return; }
    if(t==='fin'){ if(!finOn()) return; S.finance.list=S.finance.list.filter(x=>x.id!==k); ui.finForm=null; ui.confirmDel=null; commit(); toast('Buchung gelöscht'); return; }
    if(!isAdmin()) return;
    const need={day:'drinks',misc:'misc',event:'events',squad:'events',shift:'events'}[t];
    if(need?!can(need):!isFull()) return;
    ui.confirmDel=null;
    if(t==='admin'){ try{await FB.deleteDoc(D('admins',k)); logAction('Admin entfernt'); toast('Admin entfernt');}catch(e){toast('Keine Berechtigung');} render(); return; }
    if(t==='invite'){ try{await FB.deleteDoc(D('invites',k)); toast('Einladung zurückgezogen');}catch(e){toast('Keine Berechtigung');} render(); return; }
    if(t==='block'){ try{await setCode(k,''); logAction(`Zugang von ${pname(k)} gesperrt`); toast('Zugang gesperrt');}catch(e){toast('Sperren fehlgeschlagen');} render(); return; }
    if(t==='day') S.days=S.days.filter(x=>x.date!==k);
    if(t==='misc') S.misc=S.misc.filter(x=>x.id!==k);
    if(t==='event'){const e=S.events.find(x=>x.id===k); if(e&&e.poll&&Object.keys(e.poll.votes||{}).length&&e.poll.open) archivePoll(e); S.events=S.events.filter(x=>x.id!==k);}
    if(t==='squad'){const e=S.events.find(x=>x.id===k); if(e) delete e.squad;}
    if(t==='shift'){const [eid,sid]=k.split('|'), e=S.events.find(x=>x.id===eid); if(e&&e.shifts){const s=e.shifts.list.find(x=>x.id===sid); if(s) dropSignups(eid,sid,s.self||[]); e.shifts.list=e.shifts.list.filter(x=>x.id!==sid); if(!e.shifts.list.length) delete e.shifts;}}
    if(t==='player'){ if(codeOf(k)) await setCode(k,'').catch(()=>{}); S.players=S.players.filter(p=>p.id!==k); if(S.birth) delete S.birth[k]; }
    if(t==='arch') S.archive=S.archive.filter(x=>x.id!==k);
    if(ui.editKey===k) closeForm();
    commit(); toast('Gelöscht'); break;}
  case 'up': case 'down': if(isFull()){const i=+v, j=a==='up'?i-1:i+1; [S.order[i],S.order[j]]=[S.order[j],S.order[i]]; commit();} break;
  case 'preset': if(isFull()){S.club.c=[...PRESETS[+v].c]; commit(); toast(`Farben „${PRESETS[+v].n}“ übernommen`);} break;
  case 'rmImg': if(isFull()){S.club[v]=''; commit();} break;
  case 'addPlayers': {
    if(!isFull()) return;
    const ta=document.getElementById('newPlayers'); const have=new Set(S.players.map(p=>p.name.toLowerCase()));
    const names=ta.value.split(/[\n,;]+/).map(s=>s.trim().slice(0,20)).filter(s=>s&&!have.has(s.toLowerCase()));
    if(!names.length) return toast('Keine neuen Spitznamen gefunden');
    const added=names.map(n=>{const p={id:uid(),name:n,nr:''}; S.players.push(p); have.add(n.toLowerCase()); return p;});
    commit();
    try{for(const p of added) await setCode(p.id,newCode()); render();}catch(e){toast('Codes konnten nicht erzeugt werden');}
    toast(`${names.length} Spieler hinzugefügt – jetzt einladen`); break;}
  case 'bkNow': if(isFull()){addBackup(JSON.stringify(S),'Manuell'); setTimeout(render,400); toast('Sicherungspunkt angelegt');} break;
  case 'bkRestore': {if(!isFull()) return; const bk=loadBackups().find(x=>x.id===v); if(!bk) return; ui.confirmDel=null; restoreFrom(bk.data,'Wiederherstellung'); toast(`Stand vom ${fmtTs(bk.ts)} wiederhergestellt`); break;}
  case 'exportFile': {
    if(!isFull()) return;
    try{const blob=new Blob([exportJson()],{type:'application/json'}); const url=URL.createObjectURL(blob); const link=document.createElement('a');
      link.href=url; link.download=`${slug(S.appName)}_${stamp()}.json`; document.body.appendChild(link); link.click(); link.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
      logAction('Sicherung exportiert');}catch(e){toast('Speichern als Datei nicht möglich – bitte „Als Text kopieren“ nutzen');}
    break;}
  case 'exportCopy': if(isFull()){copy(exportJson()); logAction('Sicherung als Text kopiert');} break;
  case 'importDo': {if(!isFull()) return; try{const d=parseImport(ui.importText); ui.confirmDel=null; restoreFrom(JSON.stringify(d),'Import'); toast('Sicherung eingespielt');}catch(e){toast('Die Datei ist keine gültige Sicherung');} break;}
  case 'reset':
    if(!isFull()) return;
    if(v==='ask'){ui.confirmReset=true;render();}
    else if(v==='cancel'){ui.confirmReset=false;render();}
    else{ addBackup(JSON.stringify(S),'Vor Zurücksetzen');
      const keep={teamName:S.teamName,fee:S.fee,rate:S.rate,paypal:S.paypal,order:S.order,club:S.club,statsPublic:S.statsPublic,showSeason:S.showSeason};
      S = v==='sample'?{...sample(),club:keep.club}:{...emptyState(),...keep,demoCodes:{},demoMembers:[],demoLog:S.demoLog};
      normalize(); ui.confirmReset=false; closeForm(); save(); logAction('Daten zurückgesetzt'); render(); toast(v==='sample'?'Beispieldaten geladen':'Daten geleert'); }
    break;
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='fDate') ui.date=t.value;
  else if(t.id==='fTitle') ui.draft.title=t.value;
  else if(t.id==='fAmount'){ui.draft.amount=t.value; const c=document.getElementById('selCount'); if(c) c.innerHTML=countText();}
  else if(t.id==='pSearch') filterPicker(t.value);
  else if(t.id==='eTime') ui.ev.time=t.value;
  else if(t.id==='eTitle') ui.ev.title=t.value;
  else if(t.id==='ePlace') ui.ev.place=t.value;
  else if(t.id==='eNote') ui.ev.note=t.value;
  else if(t.id==='ePq') ui.ev.pq=t.value;
  else if(t.id==='ePopts') ui.ev.popts=t.value;
  else if(t.id==='eWeeks') ui.ev.weeks=t.value;
  else if(t.id==='gateCode'){const c=normCode(t.value).slice(0,8); const f=c.length>4?c.slice(0,4)+'-'+c.slice(4):c; if(t.value!==f) t.value=f;}
  else if(t.dataset.col&&isFull()){S.club.c[+t.dataset.col]=t.value; applyTheme();}
});
document.addEventListener('keydown',ev=>{
  if(ev.target.id==='chatText'&&ev.key==='Enter'&&(ev.metaKey||ev.ctrlKey||(!('ontouchstart' in window)&&!ev.shiftKey))){ev.preventDefault(); chatSend(); return;}
  if(ev.key==='Escape'&&ui.modal){ui.modal=null;renderModal();}
  if(ev.key==='Enter'&&ev.target.id==='gateCode'&&!ui.modal){ev.preventDefault();const g=document.querySelector('[data-act="gateGo"]'); if(g) g.click();}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.classList.contains('voterSel')){ui.voter=t.value; ls.set('mk-demo-voter',t.value); render(); return;}
  if(t.id==='ePoll'){ui.ev.poll=t.checked; render(); return;}
  if(t.id==='eComments'){ui.ev.comments=t.checked; return;}
  if(t.id==='ePollCmt'){ui.ev.pcomments=t.checked; return;}
  if(t.id==='eRepeat'){ui.ev.repeat=t.checked; if(t.checked&&!ui.ev.until) ui.ev.until=shiftDate(ui.date||TODAY,364); render(); return;}
  if(t.id==='eUntil'){ui.ev.until=t.value; render(); return;}
  if(t.id==='eCancel'){ui.ev.cancel=t.checked; return;}
  if(t.id==='fDate'){ui.date=t.value; return;}
  if(t.id==='chatFile'){ chatPhoto(t.files&&t.files[0]); t.value=''; return; }
  if(t.name==='prItem'&&ui.modal&&ui.modal.kind==='prCheck'){ const i=+t.value; if(t.checked) ui.modal.sel.add(i); else ui.modal.sel.delete(i); const sc=document.querySelector('.sheet').scrollTop; renderModal(); const sh=document.querySelector('.sheet'); if(sh) sh.scrollTop=sc; return; }
  if(t.id==='sFinStart'&&can('finance')){ S.finance=S.finance||{start:0,list:[]}; S.finance.start=r2(parseFloat(String(t.value).replace(',','.'))||0); commit(); return; }
  if(t.id==='shSelf'&&can('events')){const e=S.events.find(x=>x.id===ui.evDetail); if(e){e.shifts=e.shifts||{self:true,list:[]}; e.shifts.self=t.checked; commit(); toast(t.checked?'Spieler können sich selbst eintragen':'Nur das Orga-Team teilt ein');} return;}
  if(t.id==='lFormation'&&can('events')){const e=S.events.find(x=>x.id===ui.lineup); if(e){e.squad=e.squad||{ids:[],formation:'4-4-2',slots:{}}; const sq=e.squad, prev=sq.formation; sq.formation=t.value; ui.freeSel=null;
    if(t.value===FREE){ /* Start mit den Positionen des bisherigen Systems */
      if(!sq.free||!Object.keys(sq.free).length){ sq.free={}; const P=FORMS[prev]||FORMS['4-4-2']; /* Positionen derselben Reihe (z. B. Abwehrkette) auf eine Höhe bringen, damit sie im Raster nicht verrutschen */
        const lineY=y=>{const near=P.filter(f=>Math.abs(f[2]-y)<=8); return near.reduce((a,f)=>a+f[2],0)/near.length;};
        Object.entries(sq.slots||{}).forEach(([k,pid])=>{const c=P[+k]; if(c&&sq.ids.includes(pid)) sq.free[pid]={x:c[1],y:lineY(c[2])};}); }
      if(sq.grid==null) sq.grid=5; snapAll(sq);
      ui.freeEditing=true; toast('Freie Aufstellung: Spieler auf dem Feld ziehen');
    }else{ const n=FORMS[t.value].length; Object.keys(sq.slots||{}).forEach(k=>{if(+k>=n) delete sq.slots[k];}); }
    commit();} return;}
  if(t.id==='lGrid'&&can('events')){const e=S.events.find(x=>x.id===ui.lineup); if(e&&e.squad){e.squad.grid=+t.value; snapAll(e.squad); ui.freeSel=null; ui.freeEditing=true; commit(); toast(+t.value?`Raster: ${GRIDS[t.value]}`:'Ohne Raster – ganz frei');} return;}
  if(t.dataset.slot!==undefined&&can('events')){const e=S.events.find(x=>x.id===ui.lineup); if(e&&e.squad){const sl=e.squad.slots; Object.keys(sl).forEach(k=>{if(sl[k]===t.value) delete sl[k];}); if(t.value) sl[t.dataset.slot]=t.value; else delete sl[t.dataset.slot]; commit();} return;}
  if(t.id==='importFile'&&isFull()){const f=t.files&&t.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{try{parseImport(r.result); ui.importText=r.result; ui.confirmDel='import'; render();}catch(e){toast('Die Datei ist keine gültige Sicherung');}}; r.readAsText(f); return;}
  if(!isFull()) return;
  if(t.id==='sTeam'){S.teamName=t.value.trim();commit();}
  else if(t.id==='sSeason'){S.showSeason=t.checked;commit();}
  else if(t.id==='sFinOn'){S.financeOn=t.checked;commit();}
  else if(t.id==='sPayreq'){S.payreqOn=t.checked;commit();}
  else if(t.id==='sAppName'){S.appName=t.value.trim().slice(0,30)||'Mannschaftskasse';commit();}
  else if(t.id==='sFee'){S.fee=Math.max(0,parseFloat(t.value)||0);commit();}
  else if(t.id==='sRate'){S.rate=Math.max(0,parseFloat(t.value)||0);commit();}
  else if(t.id==='sPaypal'){S.paypal=t.value.trim();commit();}
  else if(t.dataset.use){S.club[t.dataset.use]=t.checked;commit();}
  else if(t.dataset.col){S.club.c[+t.dataset.col]=t.value;commit();}
  else if(t.dataset.img){const key=t.dataset.img; readImg(t.files&&t.files[0],url=>{S.club[key]=url; commit(); toast(key==='crest'?'Wappen gespeichert':'Logo gespeichert');});}
  else if(t.dataset.name){const p=pById(t.dataset.name); if(p&&t.value.trim()){p.name=t.value.trim().slice(0,20);commit();}}
  else if(t.dataset.nr){const p=pById(t.dataset.nr); if(p){p.nr=t.value.replace(/\D/g,'').slice(0,3);commit();}}
  else if(t.dataset.birth){S.birth=S.birth||{}; if(t.value) S.birth[t.dataset.birth]=t.value; else delete S.birth[t.dataset.birth]; commit();}
});
function copy(text,msg){
  const done=()=>toast(msg||'Kopiert');
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast('Kopieren nicht möglich')}ta.remove();};
  try{navigator.clipboard.writeText(text).then(done,fallback)}catch(e){fallback()}
}

/* ---------- Fernsteuerung für die Präsentationsseite (nur Demo) ---------- */
if(!LIVE_MODE) window.addEventListener('message',ev=>{
  const d=ev.data; if(!d||d.mk!=='present') return;
  if(d.reset){ ls.set(KEY,null); ls.set(BKEY,null); S=sample(); normalize(); lastSaved=JSON.stringify(S); save(); }
  ui.modal=null; renderModal(); closeForm();
  Object.assign(ui,{person:null,lineup:null,evDetail:null,reportEdit:false,confirmDel:null,confirmReset:false,demoPublic:false,showNames:null,onlyOpen:false,evView:'list',view:'list',mode:'month',y:NOW.getFullYear(),m:NOW.getMonth()});
  const debtor=()=>{const yr=yearMonths(NOW.getFullYear()); const l=sorted().map(p=>({p,o:MONEY.reduce((a,k)=>a+calc(k,p.id,yr).open,0)})).filter(x=>x.o>0).sort((a,b)=>b.o-a.o); return l.length?l[Math.min(2,l.length-1)].p.id:'';};
  if(d.role==='admin'){ui.demoAdmin='demo-full';ui.adminView=true;}
  else if(d.role==='trainer'){ui.demoAdmin='demo-part';ui.adminView=true;}
  else if(d.role==='player'){ui.demoAdmin=null;ui.adminView=false;ui.voter=debtor();}
  else if(d.role==='public'){ui.demoAdmin=null;ui.adminView=false;ui.demoPublic=true;}
  const nextGame=S.events.filter(e=>e.type==='game'&&e.date>=TODAY&&e.squad).sort((a,b)=>a.date.localeCompare(b.date))[0];
  const reported=S.events.filter(e=>reportOf(e.id)).sort((a,b)=>b.date.localeCompare(a.date))[0];
  switch(d.view){
    case 'events': ui.tab='events'; break;
    case 'roster': ui.tab='roster'; break;
    case 'settings': ui.tab='settings'; ui.playersOpen=d.scroll==='#pnl-players'; break;
    case 'drinks-form': {ui.tab='drinks'; ui.form=true; ui.date=TODAY; const ld=lastDay(); if(ld) ui.sel=new Set(ld.att.filter(pById)); break;}
    case 'drinks-table': ui.tab='drinks'; ui.view='table'; break;
    case 'stats': ui.tab='events'; ui.evView='stats'; ui.statType=d.stat||'training'; break;
    case 'report': ui.tab='events'; ui.evDetail=reported?reported.id:null; break;
    case 'lineup': ui.tab='events'; ui.lineup=nextGame?nextGame.id:null; break;
    case 'chat': ui.tab='chat'; ui.chatFirst=true; break;
    case 'shifts': {ui.tab='events'; const ev=S.events.filter(e=>e.date>=TODAY&&shiftsOf(e).length).sort((a,b)=>a.date.localeCompare(b.date))[0]; ui.evDetail=ev?ev.id:null; break;}
    case 'person': ui.person=ui.voter||debtor(); break;
    default: ui.tab='home';
  }
  render(); window.scrollTo(0,0);
  if(d.scroll) setTimeout(()=>{const el=document.querySelector(d.scroll); if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-8,behavior:'smooth'});},80);
});

/* ---------- Start ---------- */
if(LIVE_MODE){
  render();
  initFirebase().catch(e=>{console.error(e); AUTH.ready=true; AUTH.gate='error'; AUTH.error='Die App konnte nicht geladen werden. Bitte Internetverbindung prüfen.'; render();});
}else{
  try{S=JSON.parse(ls.get(KEY))}catch(e){}
  if(!S||!S.players||(S.sample&&S.sampleV!==49)) S=sample();
  normalize(); lastSaved=JSON.stringify(S); render();
}
